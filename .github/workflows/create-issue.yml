name: Create Issue

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Title of the issue to create'
        required: true
        default: 'New issue from workflow'
      body:
        description: 'Body of the issue to create'
        required: true
        default: 'Created from a workflow_dispatch run'
      branch:
        description: 'Branch to create (leave empty for bugfixes/issue-<number>)'
        required: false
        default: ''

jobs:
  create:
    uses: GitAzureFault/.github-workflows/.github/workflows/create-issue.yml@v1
    permissions:
      contents: write
      issues: write
    with:
      runner: self-hosted
      title: ${{ inputs.title }}
      body: ${{ inputs.body }}
      branch: ${{ inputs.branch }}
      
