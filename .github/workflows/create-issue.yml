name: Create Issue

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Title of the issue to create'
        required: true
        default: 'New issue from workflow'
      body:
        description: 'Body of the issue to create'
        required: true
        default: 'Created from a workflow_dispatch run'
      base:
        description: 'Branch to cut the fix branch from'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: custom-runner
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Create issue, assign to requester, open branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ inputs.title }}
          ISSUE_BODY: ${{ inputs.body }}
          ASSIGNEE: ${{ github.actor }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail

          ISSUE_URL=$(gh issue create \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY

          ---
          Requested by @${ASSIGNEE} via \`${GITHUB_WORKFLOW}\` run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            --assignee "$ASSIGNEE")
          ISSUE_NUM="${ISSUE_URL##*/}"

          SLUG=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -cs '[:alnum:]' '-' \
            | cut -c1-40 \
            | sed 's/-*$//')
          BRANCH="issue/${ISSUE_NUM}-${SLUG}"

          gh issue develop "$ISSUE_NUM" --name "$BRANCH" --base "$BASE"

          {
            echo "### Issue created"
            echo "- Issue: $ISSUE_URL"
            echo "- Branch: \`$BRANCH\`"
            echo "- Assigned to: @$ASSIGNEE"
          } >> "$GITHUB_STEP_SUMMARY"
